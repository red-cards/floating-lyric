[package]
name = "mini-lyrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "mini-lyrics"
path = "src/main.rs"

[dependencies]
mini-lyrics-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
directories = "6"
raw-window-handle = "0.6"
# Versi yang sama dengan yang dipakai eframe; untuk monitor & posisi window
# (dan ActivationPolicy di macOS).
winit = { version = "0.30", default-features = false }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Menu tray memakai muda lewat re-export `tray_icon::menu`, supaya versinya
# selalu cocok dengan tray-icon.
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication", "NSResponder", "NSView", "NSRunningApplication", "NSScreen", "NSEvent"] }
